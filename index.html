<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PELADA BN - Placar</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>
    <div class="caixa">

        <h1 class="titulo" style="text-align: center; margin: 0 0 10px;">PELADA BN</h1>

        <div class="fileira">
            <div class="time timeum">
                <h1><input type="text" id="cap1" placeholder="CAPITÃO" oninput="salvarNome('cap1')"></h1>
                <div class="vte">
                    <input class="vitoria" type="button" value="V" onclick="adicionar(3, 'time1')">
                    <input class="empate" type="button" value="E" onclick="adicionar(1, 'time1')">
                </div>
                <h1 class="placar" id="time1">0</h1>
            </div>

            <div class="time timedois">
                <h1><input type="text" id="cap2" placeholder="CAPITÃO" oninput="salvarNome('cap2')"></h1>
                <div class="vte">
                    <input class="vitoria" type="button" value="V" onclick="adicionar(3, 'time2')">
                    <input class="empate" type="button" value="E" onclick="adicionar(1, 'time2')">
                </div>
                <h1 class="placar" id="time2">0</h1>
            </div>
        </div>

        <div class="fileira">
            <div class="time timetres">
                <h1><input type="text" id="cap3" placeholder="CAPITÃO" oninput="salvarNome('cap3')"></h1>
                <div class="vte">
                    <input class="vitoria" type="button" value="V" onclick="adicionar(3, 'time3')">
                    <input class="empate" type="button" value="E" onclick="adicionar(1, 'time3')">
                </div>
                <h1 class="placar" id="time3">0</h1>
            </div>

            <div class="time timequatro">
                <h1><input type="text" id="cap4" placeholder="CAPITÃO" oninput="salvarNome('cap4')"></h1>
                <div class="vte">
                    <input class="vitoria" type="button" value="V" onclick="adicionar(3, 'time4')">
                    <input class="empate" type="button" value="E" onclick="adicionar(1, 'time4')">
                </div>
                <h1 class="placar" id="time4">0</h1>
            </div>
        </div>

        <div class="resetar" style="text-align: center;">
            <button class="finalizar" onclick="limparTudo()">
                🏆 FINALIZAR
            </button>
            <p onclick="limparHistoricoDefinitivo()"
                style="font-size: 10px; color: #8f8d8d; margin-top: 5px; cursor: pointer;">Finalizar pelada
            </p>
        </div>

        <div id="secao-historico">
            <h2>🏆 Histórico de Vencedores</h2>
            <ul id="lista-historico"></ul>
        </div>
    </div>
    <div id="btn-cronometro" onclick="toggleCronometro()">⏱️</div>

    <div id="modal-cronometro">
        <div class="modal-conteudo">
            <span class="fechar" onclick="toggleCronometro()">&times;</span>
            <h3>TEMPO DE PARTIDA</h3>
            <div id="display-tempo">00:00</div>

            <div class="controles">
                <button class="btn-start" onclick="iniciarCronometro()">INICIAR</button>
                <button class="btn-pause" onclick="pausarCronometro()">PAUSAR</button>
            </div>

            <button class="btn-reset" onclick="zerarCronometro()">ZERAR TEMPO</button>
        </div>
    </div>

    <script>
        window.onload = function () {
            // Carregar Foto salva
            const fotoSalva = localStorage.getItem('foto_pelada');
            if (fotoSalva) document.getElementById('foto-pelada').src = fotoSalva;

            // Carregar Placares e Nomes
            const placares = ['time1', 'time2', 'time3', 'time4'];
            const nomes = ['cap1', 'cap2', 'cap3', 'cap4'];
            placares.forEach(id => {
                const salvo = localStorage.getItem(id);
                if (salvo !== null) document.getElementById(id).innerText = salvo;
            });
            nomes.forEach(id => {
                const salvo = localStorage.getItem(id);
                if (salvo !== null) document.getElementById(id).value = salvo;
            });
            exibirHistorico();
        };

        function trocarFoto(input) {
            // Verificamos se existe o input e se o primeiro arquivo existe
            if (input.files && input.files) {
                const leitor = new FileReader();

                leitor.onload = function (e) {
                    const base64Image = e.target.result;
                    // Atualiza a imagem na tela
                    document.getElementById('foto-pelada').src = base64Image;
                    // Salva no navegador para não sumir ao dar F5
                    localStorage.setItem('foto_pelada', base64Image);
                };

                // A CORREÇÃO ESTÁ AQUI: Adicionamos o
                leitor.readAsDataURL(input.files);
            }
        }

        function salvarNome(idInput) {
            localStorage.setItem(idInput, document.getElementById(idInput).value);
        }

        function adicionar(pontos, idDoH1) {
            // Define o texto da mensagem baseado nos pontos
            const tipoAcao = (pontos === 3) ? "VITÓRIA" : "EMPATE";

            // Pede confirmação ao usuário
            const confirmacao = confirm(`Deseja realmente somar 1 ${tipoAcao}?`);

            if (confirmacao) {
                const display = document.getElementById(idDoH1);
                let total = (parseInt(display.innerText) || 0) + pontos;
                display.innerText = total;
                localStorage.setItem(idDoH1, total);
            }
            // Se o usuário clicar em cancelar, nada acontece.
        }

        function limparTudo() {
            const senhaCorreta = "1234";
            const senhaDigitada = prompt("Digite a senha para zerar o placar:");

            if (senhaDigitada === senhaCorreta) {
                const vencedor = calcularVencedor();

                if (vencedor.pontos > 0) {
                    confetti({
                        particleCount: 150,
                        spread: 70,
                        origin: { y: 0.6 }
                    });
                    alert(`🎉 PARABÉNS AO CAMPEÃO: ${vencedor.nome} com ${vencedor.pontos} pontos!`);
                    salvarVencedorNoHistorico(vencedor);
                }

                ['time1', 'time2', 'time3', 'time4', 'cap1', 'cap2', 'cap3', 'cap4'].forEach(item => {
                    localStorage.removeItem(item);
                });

                setTimeout(() => { location.reload(); }, 2000);
            } else if (senhaDigitada !== null) {
                alert("Senha incorreta!");
            }
        }

        function calcularVencedor() {
            const times = [
                { nome: document.getElementById('cap1').value || "Time 1", pontos: parseInt(document.getElementById('time1').innerText) },
                { nome: document.getElementById('cap2').value || "Time 2", pontos: parseInt(document.getElementById('time2').innerText) },
                { nome: document.getElementById('cap3').value || "Time 3", pontos: parseInt(document.getElementById('time3').innerText) },
                { nome: document.getElementById('cap4').value || "Time 4", pontos: parseInt(document.getElementById('time4').innerText) }
            ];
            return times.reduce((prev, curr) => (prev.pontos > curr.pontos) ? prev : curr);
        }

        function salvarVencedorNoHistorico(vencedor) {
            let historico = JSON.parse(localStorage.getItem('historico_pelada')) || [];
            const data = new Date().toLocaleDateString('pt-BR');
            const novoRegistro = `${data}: 🥇 ${vencedor.nome} (${vencedor.pontos} pts)`;

            if (historico.length >= 16) {
                historico.shift();
            }

            historico.push(novoRegistro);
            localStorage.setItem('historico_pelada', JSON.stringify(historico));
        }

        function exibirHistorico() {
            const lista = document.getElementById('lista-historico');
            const historico = JSON.parse(localStorage.getItem('historico_pelada')) || [];
            lista.innerHTML = ""; // Limpa a lista antes de renderizar

            historico.slice().reverse().forEach(item => {
                const li = document.createElement('li');
                li.innerText = item;
                li.style.color = "#ddd";
                li.style.margin = "5px 0";
                lista.appendChild(li);
            });
        }

        // Função para apagar o histórico pelo botão escondido
        function limparHistoricoDefinitivo() {
            if (prompt("Digite a senha para APAGAR O HISTÓRICO:") === "1234") {
                localStorage.removeItem('historico_pelada');
                location.reload();
            }
        }

        let cronometro;
        let segundos = 0;
        let rodando = false;

        function iniciarCronometro() {
            if (!rodando) {
                rodando = true;
                cronometro = setInterval(() => {
                    segundos++;
                    atualizarDisplay();
                }, 1000);
            }
        }

        function pausarCronometro() {
            clearInterval(cronometro);
            rodando = false;
        }

        function zerarCronometro() {
            if (confirm("Deseja zerar o tempo da partida?")) {
                clearInterval(cronometro);
                rodando = false;
                segundos = 0;
                atualizarDisplay();
            }
        }

        function atualizarDisplay() {
            const min = Math.floor(segundos / 60);
            const seg = segundos % 60;

            const tempoFormatado =
                (min < 10 ? "0" + min : min) + ":" +
                (seg < 10 ? "0" + seg : seg);

            // CORREÇÃO: Alvo agora é o display de números, não o modal todo
            document.getElementById('display-tempo').innerText = tempoFormatado;
        }

        function toggleCronometro() {
            // CORREÇÃO: Alvo agora é o modal, para ele aparecer e sumir
            const modal = document.getElementById('modal-cronometro');
            const btn = document.getElementById('btn-cronometro');
            if (modal.style.display === 'none' || modal.style.display === '') {
                modal.style.display = 'block';
                btn.style.display = "none";
            } else {
                modal.style.display = 'none';
                btn.style.display = "flex";
            }
        }
    </script>
</body>

</html>
